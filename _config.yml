# ---------------------------------------------------------------
# About you
# ---------------------------------------------------------------
author: Hudson Lazzara
title: Quiet Conversation             # blog name in browser tabs and the RSS feed
tagline:                              # lines under your photo on the homepage
  - PhD Student
  - Department of Physics, University of Oregon
email: hlazzara@uoregon.edu
github_username: merrybnon
avatar: /assets/img/avatar.jpg        # square photo works best
cv: /assets/cv.pdf                    # the CV link appears only once this file exists

# ---------------------------------------------------------------
# Blog
# ---------------------------------------------------------------
blog_title: Quiet Conversation         # the big name on the blog banner
blog_subtitle: aka The Dao That Can Be Named
description: Research, and also sometimes, not research
paginate: 8                           # posts per page on the blog home
paginate_path: /qc/page:num/

url: "https://merrybnon.github.io"
baseurl: ""

# ---------------------------------------------------------------
# Comments (giscus: stored as GitHub Discussions on this repo)
# Fill these in from https://giscus.app, then set enabled: true
# ---------------------------------------------------------------
giscus:
  enabled: false
  repo: merrybnon/merrybnon.github.io
  repo_id: ""
  category: Comments
  category_id: ""

# ---------------------------------------------------------------
# Build settings (you shouldn't need to touch these)
# ---------------------------------------------------------------
markdown: kramdown
kramdown:
  input: GFM
  math_engine: mathjax   # emits \( \) and \[ \]; KaTeX renders them in the browser
  syntax_highlighter: rouge
permalink: /:year/:month/:day/:title/
excerpt_separator: "<!--more-->"
plugins:
  - jekyll-feed
  - jekyll-paginate
feed:
  path: feed.xml
collections:
  panels:
    output: false
exclude: [README.md, Gemfile, Gemfile.lock, vendor]
defaults:
  - scope: { path: "", type: posts }
    values: { layout: post, comments: true }
