<!DOCTYPE html>
<html lang="en">
<head>
{% include head.html %}
{% include math.html %}
</head>
<body class="blog-page{% if page.layout == 'post' %} is-post{% endif %}">
  <a class="skip" href="#main">Skip to content</a>
  <div class="banner">
    <nav class="banner-nav" aria-label="Site">
      <a href="{{ '/#about' | relative_url }}">About Me</a>
      <a href="{{ '/#research' | relative_url }}">Research</a>
      <a href="{{ '/blog/' | relative_url }}" aria-current="page">Blog</a>
      <a href="{{ '/#contact' | relative_url }}">Contact</a>
    </nav>
    <header class="banner-head">
      <a class="banner-title" href="{{ '/blog/' | relative_url }}">{{ site.blog_title }}</a>
      <p class="banner-sub">{{ site.blog_subtitle }}</p>
    </header>
  </div>

  {{ content }}

  <footer class="blog-footer">&copy; {{ site.time | date: "%Y" }} {{ site.author }}</footer>
</body>
</html>
