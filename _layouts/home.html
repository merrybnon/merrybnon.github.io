---
layout: default
---
<div class="home prose">
{{ content }}
</div>

<section class="home-section" id="writing">
  <h2 class="section-title">Recent writing</h2>
  <ol class="post-list compact">
    {% for p in site.posts limit:4 %}
    <li>
      <a class="post-link" href="{{ p.url | relative_url }}">{{ p.title }}</a>
      <time datetime="{{ p.date | date_to_xmlschema }}">{{ p.date | date: "%b %Y" }}</time>
    </li>
    {% endfor %}
  </ol>
  <p><a href="{{ '/blog/' | relative_url }}">All posts</a></p>
</section>
