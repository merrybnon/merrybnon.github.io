---
layout: default
---
<article class="post">
  <header class="post-head">
    <h1 class="post-title">{{ page.title }}</h1>
    {% include post-meta.html post=page %}
  </header>

  <div class="prose">{{ content }}</div>

  <nav class="post-nav" aria-label="More posts">
    {% if page.previous %}<a class="prev" href="{{ page.previous.url | relative_url }}"><span>Older</span>{{ page.previous.title }}</a>{% endif %}
    {% if page.next %}<a class="next" href="{{ page.next.url | relative_url }}"><span>Newer</span>{{ page.next.title }}</a>{% endif %}
  </nav>

  {% include comments.html %}
</article>
