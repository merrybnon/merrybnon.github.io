---
layout: blog
title: Categories
blog: true
---
<h1 class="index-title">Posts by category</h1>
{% assign cats = site.categories | sort %}
{% for c in cats %}
<section class="index-group" id="{{ c[0] | slugify }}">
  <h2>{{ c[0] | capitalize }} <span class="count">({{ c[1].size }})</span></h2>
  <ul>
    {% for p in c[1] %}<li><a href="{{ p.url | relative_url }}">{{ p.title }}</a> <time datetime="{{ p.date | date_to_xmlschema }}">{{ p.date | date: "%-d %b %Y" }}</time></li>{% endfor %}
  </ul>
</section>
{% endfor %}
